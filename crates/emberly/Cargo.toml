[package]
name = "emberly"
description = "Emberly Code — an interactive AI coding agent for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "emberly"
path = "src/main.rs"

[dependencies]
# Internal. As the composition root, the binary also depends on the concrete
# providers/tools crates to construct the provider and tool registry it wires
# into the engine (Phase 3 builds the live providers here).
emberly-core = { path = "../emberly-core" }
emberly-tui = { path = "../emberly-tui" }
emberly-providers = { path = "../emberly-providers" }
emberly-tools = { path = "../emberly-tools" }
# The composition root also drives the self-exec Landlock shim (Phase 2 group 3),
# which restricts the child then execs — so it depends on the sandbox directly.
emberly-sandbox = { path = "../emberly-sandbox" }

# External. anyhow is confined to the binary edge (Tech Spec §1, §11).
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
async-trait.workspace = true
futures.workspace = true
# HTTP + pure-Rust TLS: the binary is the composition root that builds the
# HTTPS-capable client and installs the RustCrypto crypto provider (HC-2).
reqwest.workspace = true
rustls-rustcrypto.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Escape-test suite (Phase 2 group 9) drives the confined-exec shim binary and
# builds specs with the real type.
emberly-sandbox = { path = "../emberly-sandbox" }
# MCP connection tests (FR-11, Tech Spec §5.6) build tool-call args — already
# a workspace dependency (emberly-core/emberly-tools), not a new crate.
serde_json.workspace = true

[build-dependencies]
# Stamps the build timestamp `--version` reports (build.rs) — reruns whenever
# the package's sources change, same as any other build-script default.
time = { workspace = true }
