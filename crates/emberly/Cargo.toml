[package]
name = "emberly"
description = "Emberly Code — an interactive AI coding agent for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "emberly"
path = "src/main.rs"

[dependencies]
# Internal. As the composition root, the binary also depends on the concrete
# providers/tools crates to construct the provider and tool registry it wires
# into the engine (Phase 3 builds the live providers here).
emberly-core = { path = "../emberly-core" }
emberly-tui = { path = "../emberly-tui" }
emberly-providers = { path = "../emberly-providers" }
emberly-tools = { path = "../emberly-tools" }

# External. anyhow is confined to the binary edge (Tech Spec §1, §11).
anyhow.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
async-trait.workspace = true
futures.workspace = true
# HTTP + pure-Rust TLS: the binary is the composition root that builds the
# HTTPS-capable client and installs the RustCrypto crypto provider (HC-2).
reqwest.workspace = true
rustls-rustcrypto.workspace = true
