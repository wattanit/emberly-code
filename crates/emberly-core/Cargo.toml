[package]
name = "emberly-core"
description = "The engine: agent loop, event model, session, context management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Internal (one-way flow: core -> {providers, tools, sandbox} via traits).
emberly-providers = { path = "../emberly-providers" }
emberly-tools = { path = "../emberly-tools" }
emberly-sandbox = { path = "../emberly-sandbox" }

# External.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "process", "time", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
base64.workspace = true
