[package]
name = "emberly-core"
description = "The engine: agent loop, event model, session, context management"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
# Internal (one-way flow: core -> {providers, tools, sandbox} via traits).
emberly-providers = { path = "../emberly-providers" }
emberly-tools = { path = "../emberly-tools" }
emberly-sandbox = { path = "../emberly-sandbox" }

# External.
# `io-util` added for the first-party MCP stdio client (FR-11, Tech Spec
# §5.6): AsyncBufReadExt/AsyncWriteExt over the spawned server's pipes — no
# new dependency, an existing one's feature (Tech Spec §12).
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "process", "time", "macros", "io-util"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true
futures.workspace = true
async-trait.workspace = true
toml.workspace = true
rustix = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
base64.workspace = true
