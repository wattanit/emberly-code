[package]
name = "emberly-tui"
description = "The ratatui terminal frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# Internal (tui -> core only; nothing depends on tui).
emberly-core = { path = "../emberly-core" }

# External. The Phase 1 line-mode frontend needs only stdio + channels;
# ratatui/crossterm/syntect/unicode-* arrive with the full TUI in Phase 4.
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "sync", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
