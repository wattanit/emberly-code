[package]
name = "emberly-providers"
description = "Provider trait and provider clients (Anthropic, OpenAI-compatible)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
bytes.workspace = true
fastrand.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "test-util"] }
futures.workspace = true
wiremock = "0.6"
# When built under `--workspace`, reqwest's rustls feature is unified on, so
# constructing a Client needs a crypto provider installed — use the same
# pure-Rust one the binary uses.
rustls-rustcrypto.workspace = true
