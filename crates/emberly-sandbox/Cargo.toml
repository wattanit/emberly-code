[package]
name = "emberly-sandbox"
description = "Permission rule engine and OS-level confinement (Landlock, Seatbelt)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Security-critical crate: dependency list is frozen harder than the rest
# (Tech Spec §1, §15). Additions require explicit owner sign-off. Landlock
# (Linux) and the macOS confinement path arrive in Phases 2 and 5.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The `permissions.toml` rule format is defined with the engine so it lives in
# one place; `toml` is already a workspace dep and pure-Rust (HC-2 clean).
toml.workspace = true

# Landlock confinement (Linux only). Pure-Rust; gated so the crate still builds
# and the degraded path still runs on every other OS (Phase 2 platform note).
[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
