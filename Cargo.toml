[workspace]
resolver = "2"
members = [
    "crates/emberly-core",
    "crates/emberly-providers",
    "crates/emberly-tools",
    "crates/emberly-sandbox",
    "crates/emberly-tui",
    "crates/emberly",
]

[workspace.package]
version = "0.5.1"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
authors = ["Wattanit"]
repository = ""

# Centralized dependency versions (HC-2: pure-Rust, rustls-only, no C deps).
# Foundational deps are declared here from Phase 0; heavier per-layer deps
# (reqwest, ratatui, syntect, landlock, ignore/grep-searcher, similar, …) are
# added to this table by the phase that introduces them — see
# IMPLEMENTATION_PLAN.md and docs/emberly-code-tech-spec.md §12.
[workspace.dependencies]
tokio = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
toml = "0.8"
time = { version = "0.3", features = ["serde-well-known", "formatting", "parsing"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
futures = "0.3"
similar = "2"
# HTTP client for provider backends. Pure-Rust TLS only (HC-2): the
# `*-no-provider` rustls feature pulls rustls WITHOUT `ring`/`aws-lc-rs`; the
# binary installs a RustCrypto crypto provider (see `rustls-rustcrypto`). Client
# libraries take an injected `reqwest::Client` and test over plain HTTP.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots-no-provider"] }
bytes = "1"
fastrand = "2"
# Pure-Rust rustls crypto provider (owner decision — see memory/tls-pure-rust
# -decision). Currently alpha; track for maturity/audit before v1.
rustls-rustcrypto = "=0.0.2-alpha"
# --- Phase 4 (full TUI) ---
# ratatui with ONLY the crossterm backend (default features off drops the
# optional `palette`/`underline-color` extras we don't need). We use ratatui's
# re-exported `crossterm` rather than declaring it separately, so there is one
# crossterm version in the graph — no duplicate-version split (cargo-deny).
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
# crossterm pinned to the version ratatui 0.29 uses (0.28) so feature
# unification produces ONE copy. Declared directly (not just via ratatui's
# re-export) because we need `bracketed-paste` + the `events` reader (key,
# resize, and mouse events — Design §3.4 mouse support rides the same reader),
# which ratatui's backend feature does not turn on. `events` is a crossterm
# default feature; naming it explicitly here keeps mouse/key capture from being
# dropped if defaults ever change (Tech Spec §9 / HC-2 — no new crate).
crossterm = { version = "0.28", features = ["bracketed-paste", "events"] }
# syntect for fenced-code highlighting. HC-2: `default-features = false` +
# `default-fancy` selects the pure-Rust `fancy-regex` engine; the default
# `default-onig` backend is Oniguruma (C) and is forbidden.
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
# Grapheme-cluster + column-width handling for Thai/CJK text (Tech Spec §9):
# never str::len, never chars-as-columns.
unicode-segmentation = "1"
unicode-width = "0.2"
# --- Phase 2 (safety story) — owner-signed-off additions (Tech Spec §1, §12) ---
# Landlock LSM confinement on Linux. Pure-Rust syscall wrapper (no libc/C on the
# sandbox path — HC-2 clean). Declared here; only `emberly-sandbox` pulls it, and
# only on `cfg(target_os = "linux")`.
landlock = "0.4"
# Process-group signaling for bash tree-kill (S-4). Pure-Rust `linux_raw` backend
# on Linux (no libc → HC-2 clean); preferred over the libc-based `nix`. Only the
# `process` feature (kill/getpgid) is enabled. Used by `emberly-tools` on unix.
rustix = { version = "1", features = ["process"] }
# ripgrep libraries for the glob/grep tools (T-5, T-6) — all pure-Rust. `ignore`
# walks the tree honoring `.gitignore`; `globset` compiles glob patterns;
# `grep-searcher` + `grep-regex` are the line-oriented regex search path.
ignore = "0.4"
globset = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"
# --- Phase 2 / v0.4 (multimodal image, P-11/T-12) — pure-Rust, HC-2 ---
# `base64` encodes image bytes for the ContentBlock::Image; `imagesize` reads
# format + dimensions from the header only (no codec tree — deliberately over
# the full `image` crate).
base64 = "0.22"
imagesize = { version = "0.15", features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
# Fully static musl builds (HC-2) prefer small, predictable binaries.
strip = true
lto = "thin"
